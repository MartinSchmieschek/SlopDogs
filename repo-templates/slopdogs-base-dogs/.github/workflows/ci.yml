# CI von slopdogs-base-dogs (PLAN-DOG-PAKETE P3): alle Pakete bauen, Paket-Tests, Lint/Format, Surface jedes
# Pakets gegen seine zuletzt veroeffentlichte Fassung. core und das Typ-Werkzeug kommen aus GitHub Packages:
# GITHUB_TOKEN braucht packages: read, und das Paket slopdogs-core muss diesem Repo Lesezugriff geben
# (Package settings -> Manage Actions access).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags fuer die Gegenprobe der Surface-Pruefung
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@martinschmieschek'
      - name: npm ci (baut alle Pakete ueber prepare der Wurzel)
        run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - name: Surface jedes Pakets gegen seine zuletzt veroeffentlichte Fassung
        run: node scripts/surface-check.cjs
